<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14132B" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="LastScene remembers where things were left, so the people who care for someone can see the day at a glance.">
  <title>LastScene</title>
  <script>
    // Display settings (lib/display.ts) before the first paint, so large text or a dark theme never flashes.
    (function () {
      try {
        var d = JSON.parse(localStorage.getItem("lastscene-display") || "{}") || {};
        var r = document.documentElement, mm = window.matchMedia;
        var dark = d.theme === "dark" || (d.theme !== "light" && mm && mm("(prefers-color-scheme: dark)").matches);
        if (d.text === "large" || d.text === "largest") r.dataset.text = d.text;
        if (d.contrast === "high") r.dataset.contrast = "high";
        if (d.motion === "reduce") r.dataset.motion = "reduce";
        r.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232E2A5C'/%3E%3Crect x='5' y='8' width='22' height='16' rx='3.5' fill='none' stroke='%23FFFFFF' stroke-width='2.4'/%3E%3Ccircle cx='16' cy='16' r='4' fill='none' stroke='%23F5B23C' stroke-width='2.4'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
