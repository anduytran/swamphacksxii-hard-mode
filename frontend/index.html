<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LastScene</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@auth0/auth0-spa-js@2.1.3/dist/auth0-spa-js.production.js"></script>
</head>
<body>
  <header>
    <h1>LastScene</h1>
    <div id="user-bar" hidden>
      <span id="user-name"></span>
      <button id="refresh" type="button">Refresh</button>
      <button id="logout" type="button" class="secondary">Log out</button>
    </div>
  </header>

  <main>
    <section id="logged-out" hidden>
      <button id="login" type="button">Log in with Auth0</button>
    </section>

    <section id="logged-in" hidden>
      <p class="hint">What was recorded in the last 24 hours, newest first.</p>
      <p id="status" role="status"></p>
      <ol id="feed"></ol>
    </section>
  </main>

  <template id="entry-template">
    <li class="entry">
      <img alt="" loading="lazy">
      <div class="entry-body">
        <time></time>
        <p class="transcript"></p>
      </div>
    </li>
  </template>

  <script src="app.js"></script>
</body>
</html>
